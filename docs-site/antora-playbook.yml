site:
  title: Building Documentation At Scale With Antora and Asciidoc
  start_page: acorn:intro:toc.adoc

antora:
  extensions:
    - require: ./lib/terms-extension.js
      data:
        styles:
          TeX: '*T~E~X*'
          Acorn Runner: "Acorn Runner"

asciidoc:
  attributes:
    pagination: true
    tex-name: '*T~E~X*'

content:
  sources: 
  - url: ..
    branches: HEAD
    start_path: antora-book/

ui: 
  bundle:
    url: ../docs-ui/build/ui-bundle.zip
